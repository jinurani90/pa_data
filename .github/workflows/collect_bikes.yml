name: Collect Dublin Bikes data

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: collect-dublinbikes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collect.txt
      - name: Install collector dependency
        run: python -m pip install -r requirements-collect.txt
      - name: Collect a snapshot
        run: python dublinbikes/collectors/bikes_collect.py
        env:
          BIKES_USER_AGENT: ${{ vars.BIKES_USER_AGENT }}
          AE_USER_AGENT: ${{ vars.AE_USER_AGENT }}
      - name: Commit collected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Collect Dublin Bikes snapshot"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
